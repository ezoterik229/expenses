<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расходы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Открываем раздел, где были в прошлый раз (Расходы или Японский)
try {
  if (/[?&]stay=1/.test(location.search)) localStorage.setItem("app_last", "exp");
  else if (localStorage.getItem("app_last") === "jp") location.replace("jp/" + location.hash);
} catch (e) {}
</script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#6b7280);
  --link:var(--tg-theme-link-color,#2481cc);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --card:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --line:color-mix(in srgb,var(--hint) 25%,transparent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.appsw{display:flex;gap:6px;padding:10px 0 0}
.appsw a,.appsw span{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--hint)}
.appsw span{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header h1{font-size:18px;margin:0}
.nav button{background:none;border:0;color:var(--link);font-size:22px;padding:4px 10px;cursor:pointer}
.month{font-weight:600;min-width:120px;text-align:center;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:none;color:var(--text);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.total{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.total .big{font-size:28px;font-weight:700}
.total .sub{color:var(--hint);font-size:14px}
.bars{margin-top:10px;display:grid;gap:8px}
.bar .top{display:flex;justify-content:space-between;font-size:14px}
.bar .track{height:6px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--btn);border-radius:3px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:18px 0 6px;font-weight:600;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .ico{font-size:22px;width:32px;text-align:center}
.row .mid{flex:1;min-width:0}
.row .cat{font-size:15px}
.row .note{color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.conv{color:var(--hint);font-size:12px;font-weight:400}
.rate{color:var(--hint);font-size:12px;text-align:center;margin:18px 0 0}
.empty{color:var(--hint);text-align:center;padding:40px 0}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:560px;margin:0 auto}
.dock form{display:flex;gap:8px}
.dock input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--card);border:0;border-radius:12px;padding:12px 14px;outline:none}
.dock button{background:var(--btn);color:var(--btn-text);border:0;border-radius:12px;padding:0 18px;font-size:18px;cursor:pointer}
.preview{font-size:13px;color:var(--hint);min-height:18px;margin:0 2px 6px}
dialog{border:0;border-radius:16px;background:var(--bg);color:var(--text);padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px}
dialog .note{color:var(--hint);font-size:14px;margin-bottom:12px}
.danger{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:0;background:#e5484d;color:#fff;font-size:16px;cursor:pointer}
.close{margin-top:8px;width:100%;padding:11px;border-radius:12px;border:0;background:var(--card);color:var(--text);font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <nav class="appsw"><span>💰 Расходы</span><a href="jp/" id="toJp">🗾 Японский</a></nav>
  <header>
    <h1>Расходы</h1>
    <div class="nav"><button id="prev" aria-label="Предыдущий месяц">‹</button><span class="month" id="month"></span><button id="next" aria-label="Следующий месяц">›</button></div>
  </header>
  <div class="total"><div class="big" id="sum">0</div><div class="sub" id="cnt"></div><div class="bars" id="bars"></div></div>
  <div id="list"></div>
  <div class="rate" id="rate"></div>
</div>

<div class="dock"><div class="in">
  <div class="preview" id="preview"></div>
  <form id="form" autocomplete="off">
    <input id="inp" type="text" inputmode="text" placeholder="2$ на игры, кофе 5€, такси 300 руб" enterkeyhint="send">
    <button type="submit" aria-label="Добавить">＋</button>
  </form>
</div></div>

<dialog id="dlg">
  <h3 id="dAmt"></h3><div class="note" id="dNote"></div>
  <div class="chips" id="dCats"></div>
  <button class="danger" id="dDel">Удалить</button>
  <button class="close" id="dClose">Закрыть</button>
</dialog>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

/* ---------- Категории ---------- */
const CATS = [
  ["Еда","🛒","еда|продукт|магазин|супермаркет|пятёрочк|пятерочк|ашан|лента|магнит|молок|хлеб|овощ|фрукт|мясо|grocer|food|market"],
  ["Кафе и рестораны","☕","кофе|кафе|ресторан|обед|ужин|завтрак|перекус|пицц|бургер|суши|ролл|макдак|kfc|burger|кебаб|шаурм|coffee|lunch|dinner|bar\\b|пиво|вино|доставк"],
  ["Транспорт","🚕","такси|метро|автобус|маршрутк|бензин|заправк|парковк|проезд|uber|bolt|yandex go|поезд|электричк|taxi|fuel|самокат|каршеринг"],
  ["Игры и развлечения","🎮","игр|game|steam|playstation|\\bps\\d?\\b|xbox|nintendo|донат|кино|концерт|театр|боулинг|клуб|квест|аттракцион|парк"],
  ["Подписки и сервисы","📺","подписк|netflix|spotify|youtube|chatgpt|claude|icloud|google one|vpn|впн|хостинг|сервер|домен|apple music|premium"],
  ["Покупки","🛍","одежд|кроссовк|обув|куртк|джинс|футболк|ozon|озон|wildberries|вайлдберриз|amazon|aliexpress|телефон|наушник|ноутбук|покупк|товар|техник"],
  ["Здоровье","💊","аптек|лекарств|таблетк|врач|стоматолог|больниц|анализ|клиник|витамин|спортзал|тренировк|абонемент"],
  ["Жильё и счета","🏠","аренд|квартир|коммунал|свет\\b|электричеств|газ\\b|вода\\b|ипотек|ремонт|мебел|жкх"],
  ["Связь и интернет","📶","интернет|мобильн|симк|сим-карт|тариф|связь|wifi|wi-fi"],
  ["Подарки","🎁","подар|цветы|букет|открытк"],
  ["Прочее","📦",""]
];
const CAT_RE = CATS.map(c => c[2] ? new RegExp("(^|[^a-zа-яё0-9])(" + c[2] + ")", "i") : null);
const CAT_ICON = Object.fromEntries(CATS.map(c => [c[0], c[1]]));

function detectCategory(text) {
  for (let i = 0; i < CATS.length; i++) if (CAT_RE[i] && CAT_RE[i].test(text)) return CATS[i][0];
  return "Прочее";
}

/* ---------- Разбор текста ---------- */
const CUR_SYM = { USD: "$", EUR: "€", RUB: "₽" };
let defaultCur = "USD";

/* ---------- Курсы валют (единиц за 1 USD) ---------- */
let rates = { USD: 1, EUR: 0.9, RUB: 80 };
let ratesInfo = "курс приблизительный";
const CUR_LIST = ["USD", "EUR", "RUB"];
const conv = (a, from, to) => a / rates[from] * rates[to];
function loadCachedRates() {
  try {
    const c = JSON.parse(localStorage.getItem("exp_rates") || "null");
    if (c && c.r && c.r.EUR && c.r.RUB) { rates = { USD: 1, EUR: c.r.EUR, RUB: c.r.RUB }; ratesInfo = "курс на " + c.d + " (из кэша)"; return c.t; }
  } catch (e) {}
  return 0;
}
async function refreshRates() {
  const t = loadCachedRates();
  if (t && Date.now() - t < 6 * 3600e3) { ratesInfo = ratesInfo.replace(" (из кэша)", ""); return; }
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const j = await res.json();
    if (j.result === "success" && j.rates.EUR && j.rates.RUB) {
      rates = { USD: 1, EUR: j.rates.EUR, RUB: j.rates.RUB };
      const d = new Date(), ds = pad(d.getDate()) + "." + pad(d.getMonth() + 1);
      ratesInfo = "курс на " + ds;
      try { localStorage.setItem("exp_rates", JSON.stringify({ t: Date.now(), d: ds, r: rates })); } catch (e) {}
    }
  } catch (e) {}
}

function parse(text) {
  const t = text.trim();
  const m = t.match(/(\d+(?:[  ]\d{3})*(?:[.,]\d{1,2})?|\d+)/);
  if (!m) return null;
  const amount = parseFloat(m[1].replace(/[  ]/g, "").replace(",", "."));
  if (!(amount > 0)) return null;
  let cur = defaultCur;
  if (/\$|usd|доллар|бакс/i.test(t)) cur = "USD";
  else if (/€|eur|евро/i.test(t)) cur = "EUR";
  else if (/₽|rub|руб|(^|\s)р(\.|\s|$)/i.test(t)) cur = "RUB";
  let note = t.replace(m[0], " ")
    .replace(/\$|€|₽|usd|eur|rub|доллар[а-яё]*|бакс[а-яё]*|евро|руб[а-яё]*/ig, " ")
    .replace(/(^|\s)(потратил[а-яё]*|купил[а-яё]*|заплатил[а-яё]*|отдал[а-яё]*|на|за|вчера|р\.?)(?=\s|$)/ig, " ")
    .replace(/\s+/g, " ").trim();
  if (!note) note = t;
  const date = /вчера/i.test(t) ? addDays(today(), -1) : today();
  return { a: amount, c: cur, g: detectCategory(t), n: note.slice(0, 80), d: date };
}

/* ---------- Даты ---------- */
const pad = n => String(n).padStart(2, "0");
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DAYS = ["вс","пн","вт","ср","чт","пт","сб"];
function dayLabel(s) {
  if (s === today()) return "Сегодня";
  if (s === addDays(today(), -1)) return "Вчера";
  const d = new Date(s + "T12:00:00");
  return d.getDate() + " " + MONTHS[d.getMonth()].toLowerCase().replace(/ь$|й$/, "я") + ", " + DAYS[d.getDay()];
}

/* ---------- Хранилище: Telegram CloudStorage или localStorage ---------- */
const useCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));
const P = "exp_";
const store = {
  getKeys() {
    if (useCloud) return new Promise(r => tg.CloudStorage.getKeys((e, k) => r(e ? [] : k)));
    try { return Promise.resolve(Object.keys(localStorage).filter(k => k.startsWith(P)).map(k => k.slice(P.length))); }
    catch (e) { return Promise.resolve([]); }
  },
  getItems(keys) {
    if (!keys.length) return Promise.resolve({});
    if (useCloud) return new Promise(r => tg.CloudStorage.getItems(keys, (e, v) => r(e ? {} : v)));
    const o = {};
    try { keys.forEach(k => { const v = localStorage.getItem(P + k); if (v != null) o[k] = v; }); } catch (e) {}
    return Promise.resolve(o);
  },
  setItem(k, v) {
    if (useCloud) return new Promise(r => tg.CloudStorage.setItem(k, v, () => r()));
    try { localStorage.setItem(P + k, v); } catch (e) {}
    return Promise.resolve();
  },
  removeItem(k) {
    if (useCloud) return new Promise(r => tg.CloudStorage.removeItem(k, () => r()));
    try { localStorage.removeItem(P + k); } catch (e) {}
    return Promise.resolve();
  }
};

/* ---------- Состояние ---------- */
let allKeys = new Set();
const days = {};          // "YYYY-MM-DD" -> [ {i,a,c,g,n} ]
let ym = today().slice(0, 7);
let curFilter = null;

const dk = d => "d_" + d;
function parseDay(v) { try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (e) { return []; } }

async function loadMonth() {
  const keys = [...allKeys].filter(k => k.startsWith("d_" + ym) && !(k.slice(2) in days));
  const got = await store.getItems(keys);
  keys.forEach(k => { days[k.slice(2)] = parseDay(got[k]); });
}
async function saveDay(d) {
  const arr = days[d] || [];
  if (arr.length) { await store.setItem(dk(d), JSON.stringify(arr)); allKeys.add(dk(d)); }
  else { await store.removeItem(dk(d)); allKeys.delete(dk(d)); delete days[d]; }
}

/* ---------- Отрисовка ---------- */
const $ = id => document.getElementById(id);
const fmt = (n, c) => {
  const s = Number(n).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  return c === "RUB" ? s + " ₽" : (CUR_SYM[c] || "") + s;
};

const usd = e => e.u != null ? e.u : conv(e.a, e.c, "USD");
const fmtOthers = (a, c) => CUR_LIST.filter(x => x !== c).map(x => fmt(conv(a, c, x), x)).join(" · ");

function monthEntries() {
  const out = [];
  Object.keys(days).filter(d => d.startsWith(ym)).sort().reverse().forEach(d => days[d].forEach(e => out.push({ d, e })));
  return out;
}

function render() {
  const [y, m] = ym.split("-").map(Number);
  $("month").textContent = MONTHS[m - 1] + " " + y;
  const items = monthEntries();
  const shown = items;
  const total = shown.reduce((s, x) => s + usd(x.e), 0);
  $("sum").textContent = fmt(total, "USD");
  $("cnt").textContent = shown.length ? shown.length + " " + plural(shown.length) + " · ≈ " + fmtOthers(total, "USD") : "Трат пока нет";
  $("rate").textContent = ratesInfo + " · итоги в $ по курсу на момент траты";

  const byCat = {};
  shown.forEach(x => { byCat[x.e.g] = (byCat[x.e.g] || 0) + usd(x.e); });
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  $("bars").innerHTML = rows.map(([g, v]) =>
    '<div class="bar"><div class="top"><span>' + (CAT_ICON[g] || "📦") + " " + esc(g) + "</span><span>" + fmt(v, "USD") +
    ' · ' + Math.round(v / total * 100) + '%</span></div><div class="track"><div class="fill" style="width:' + (v / rows[0][1] * 100) + '%"></div></div></div>').join("");

  if (!items.length) { $("list").innerHTML = '<div class="empty">Напишите внизу, например:<br><b>2$ на игры</b></div>'; return; }
  let html = "", last = "";
  items.forEach(({ d, e }) => {
    if (d !== last) {
      const dayTotal = days[d].reduce((s, x) => s + usd(x), 0);
      html += "<h2><span>" + dayLabel(d) + "</span><span>" + (dayTotal ? fmt(dayTotal, "USD") : "") + "</span></h2>";
      last = d;
    }
    html += '<div class="row" data-d="' + d + '" data-i="' + e.i + '"><div class="ico">' + (CAT_ICON[e.g] || "📦") + '</div><div class="mid"><div class="cat">' +
      esc(e.g) + '</div><div class="note">' + esc(e.n) + '</div></div><div class="amt">' + fmt(e.a, e.c) +
      (e.c !== "USD" ? '<div class="conv">≈ ' + fmt(usd(e), "USD") + "</div>" : "") + "</div></div>";
  });
  $("list").innerHTML = html;
}
function plural(n) { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "трата" : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? "траты" : "трат"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- Действия ---------- */
function haptic(t) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} }

$("inp").addEventListener("input", () => {
  const p = parse($("inp").value);
  $("preview").textContent = p ? "→ " + fmt(p.a, p.c) + " (≈ " + fmtOthers(p.a, p.c) + ") · " + (CAT_ICON[p.g] || "") + " " + p.g : "";
});

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const p = parse($("inp").value);
  if (!p) { haptic("error"); $("preview").textContent = "Не вижу сумму. Пример: 2$ на игры"; return; }
  const entry = { i: Date.now().toString(36), a: p.a, c: p.c, g: p.g, n: p.n, u: +conv(p.a, p.c, "USD").toFixed(4) };
  const d = p.d;
  if (!days[d]) { const got = await store.getItems([dk(d)]); days[d] = parseDay(got[dk(d)]); }
  days[d].push(entry);
  await saveDay(d);
  ym = d.slice(0, 7);
  await loadMonth();
  $("inp").value = ""; $("preview").textContent = "";
  haptic("success"); render();
});

$("prev").onclick = () => shiftMonth(-1);
$("next").onclick = () => shiftMonth(1);
async function shiftMonth(n) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + n, 1);
  ym = d.getFullYear() + "-" + pad(d.getMonth() + 1);
  await loadMonth(); render();
}

let cur = null;
$("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const d = row.dataset.d, i = row.dataset.i;
  const entry = (days[d] || []).find(x => x.i === i); if (!entry) return;
  cur = { d, entry };
  $("dAmt").textContent = fmt(entry.a, entry.c);
  $("dNote").textContent = entry.n + " · ≈ " + fmtOthers(entry.a, entry.c);
  $("dCats").innerHTML = CATS.map(c => '<button class="chip' + (c[0] === entry.g ? " on" : "") + '" data-g="' + esc(c[0]) + '">' + c[1] + " " + esc(c[0]) + "</button>").join("");
  $("dlg").showModal();
});
$("dCats").addEventListener("click", async e => {
  const g = e.target.dataset.g; if (!g || !cur) return;
  cur.entry.g = g; await saveDay(cur.d); $("dlg").close(); render();
});
$("dDel").onclick = async () => {
  if (!cur) return;
  days[cur.d] = days[cur.d].filter(x => x.i !== cur.entry.i);
  await saveDay(cur.d); $("dlg").close(); haptic("warning"); render();
};
$("dClose").onclick = () => $("dlg").close();
$("toJp").onclick = e => { e.preventDefault(); try { localStorage.setItem("app_last", "jp"); } catch (x) {} location.href = "jp/" + location.hash; };

/* ---------- Старт ---------- */
(async function init() {
  const keys = await store.getKeys();
  allKeys = new Set(keys);
  const got = await store.getItems(["cfg"]);
  try { const c = JSON.parse(got.cfg || "{}"); if (c.cur) defaultCur = c.cur; } catch (e) {}
  await refreshRates();
  await loadMonth();
  render();
})();
</script>
</body>
</html>
